name: Release mod

# Runs when a GitHub Release is published on this repo. Builds the mod zip
# against the game/SMAPI reference assemblies checked out via the private
# `vendor` git submodule (yukipastelcat/stardew-ds-refs, fetched with a
# read-only deploy key) using whatever version is already committed in
# manifest.json/StardewDS.csproj, and attaches the zip to that release.
#
# Versioning is manual: bump manifest.json's Version and StardewDS.csproj's
# <Version> yourself, commit, then publish a release on that commit - this
# workflow only builds and attaches, it never creates or edits the release.
#
# One-time setup: see README.md#ci-builds for how the REFS_DEPLOY_KEY secret
# and the stardew-ds-refs repo (the vendor submodule) are set up.
#
# vendor is deliberately NOT fetched via actions/checkout's own
# `submodules:` input. actions/checkout unconditionally rewrites
# git@github.com: submodule URLs to HTTPS (using its own GITHUB_TOKEN)
# whenever it performs the submodule fetch itself, unless you hand it an
# `ssh-key` input directly - and that input would apply to the *whole*
# checkout, including this repo's own clone, which REFS_DEPLOY_KEY isn't
# authorized for (it's a read-only deploy key scoped to stardew-ds-refs
# only). So the main repo is checked out normally, and vendor is fetched
# afterwards with a plain `git submodule update`, once the deploy key's
# SSH agent is loaded - a bare git command isn't subject to actions/
# checkout's URL rewriting, so it honors the git@github.com: URL in
# .gitmodules and authenticates with the agent as normal.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build and attach
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load deploy key for reference assemblies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.REFS_DEPLOY_KEY }}

      - name: Fetch vendor submodule
        run: git submodule update --init --recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Build mod (produces the release zip via ModBuildConfig)
        run: dotnet build StardewDS.csproj -c Release "/p:GamePath=${{ github.workspace }}/vendor/lib"

      - name: Locate built zip
        id: modzip
        run: |
          zip_path=$(ls bin/Release/net6.0/*.zip | head -n1)
          if [ -z "$zip_path" ]; then
            echo "::error::No mod zip found under bin/Release/net6.0/ - check EnableModZip in StardewDS.csproj."
            exit 1
          fi
          echo "path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Upload zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.modzip.outputs.path }}" --clobber
